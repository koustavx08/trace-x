global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tracex-prod'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

# NOTE: scrape_configs below is trimmed to targets that are actually
# defined as services in docker/docker-compose.prod.yml today. nginx-exporter,
# cadvisor, and node-exporter from the original config are still NOT deployed
# anywhere in this repo (tracked in docs/KNOWN_LIMITATIONS.md); postgres and
# redis exporters now are.
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'tracex-backend'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'tracex-backend'

  # Frontend metrics (if Next.js exposes metrics)
  - job_name: 'tracex-frontend'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['frontend:3000']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'neo4j'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['neo4j:2004']