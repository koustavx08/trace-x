services:
  postgres:
    image: postgres:15-alpine
    container_name: tracex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracex}
      POSTGRES_DB: ${POSTGRES_DB:-tracex}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracex} -d ${POSTGRES_DB:-tracex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tracex-network

  neo4j:
    image: neo4j:5.15-community
    container_name: tracex-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-tracexneo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-tracexneo4j}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - tracex-network

  redis:
    image: redis:7-alpine
    container_name: tracex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tracex-network

  backend:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tracex-backend
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-trace-x-super-secret-key-change-in-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD:-tracex}@postgres:5432/${POSTGRES_DB:-tracex}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tracexneo4j}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      LOG_LEVEL: DEBUG
      # Provider / AI credentials, interpolated from docker/.env (Compose reads
      # .env from the directory of the first -f file). These were previously
      # absent from every service block, so no key ever reached a container:
      # ProviderFactory registered zero chains and every live analysis failed
      # with "No provider configured for chain ID: 1". Empty values are fine --
      # each is `str | None` in Settings and falsy-guarded at registration.
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      INFURA_API_SECRET: ${INFURA_API_SECRET:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      CHAINALYSIS_API_KEY: ${CHAINALYSIS_API_KEY:-}
      CIPHERTRACE_API_KEY: ${CIPHERTRACE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Interpolated from docker/.env like every other credential here. The
      # key used to be written inline, which committed a live OpenRouter
      # secret to a public repository; it must be treated as burned and
      # rotated. The model default is a current OpenRouter slug --
      # anthropic/claude-3.5-sonnet has been retired, and every request for it
      # returns 404, which the AI provider swallows into a template answer.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODE: ${AI_MODE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tracex-worker
    command: ["celery", "-A", "src.workers.main.celery_app", "worker", "--loglevel=info"]
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-trace-x-super-secret-key-change-in-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD:-tracex}@postgres:5432/${POSTGRES_DB:-tracex}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tracexneo4j}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
      # Provider / AI credentials, interpolated from docker/.env (Compose reads
      # .env from the directory of the first -f file). These were previously
      # absent from every service block, so no key ever reached a container:
      # ProviderFactory registered zero chains and every live analysis failed
      # with "No provider configured for chain ID: 1". Empty values are fine --
      # each is `str | None` in Settings and falsy-guarded at registration.
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      INFURA_API_SECRET: ${INFURA_API_SECRET:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      CHAINALYSIS_API_KEY: ${CHAINALYSIS_API_KEY:-}
      CIPHERTRACE_API_KEY: ${CIPHERTRACE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODE: ${AI_MODE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
    volumes:
      - ../apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tracex-beat
    command: ["celery", "-A", "src.workers.main.celery_app", "beat", "--loglevel=info"]
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-trace-x-super-secret-key-change-in-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD:-tracex}@postgres:5432/${POSTGRES_DB:-tracex}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tracexneo4j}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
      # Provider / AI credentials, interpolated from docker/.env (Compose reads
      # .env from the directory of the first -f file). These were previously
      # absent from every service block, so no key ever reached a container:
      # ProviderFactory registered zero chains and every live analysis failed
      # with "No provider configured for chain ID: 1". Empty values are fine --
      # each is `str | None` in Settings and falsy-guarded at registration.
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      INFURA_API_SECRET: ${INFURA_API_SECRET:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      CHAINALYSIS_API_KEY: ${CHAINALYSIS_API_KEY:-}
      CIPHERTRACE_API_KEY: ${CIPHERTRACE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODE: ${AI_MODE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
    volumes:
      - ../apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network

  frontend:
    build:
      # Repo root, so the npm workspace install can see packages/shared.
      # apps/web alone cannot resolve the @trace-x/shared dependency.
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: tracex-frontend
    environment:
      # NEXT_PUBLIC_* is inlined into browser bundles, so this must be a URL the
      # *browser* can reach. "http://backend:8000" only resolves inside the
      # compose network, so every client-side API call failed; localhost:8000 is
      # the published backend port on the host.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      # Live-reload mounts mirror the in-image monorepo layout. The anonymous
      # volumes keep the image's installed/compiled artifacts from being
      # shadowed by the bind mounts.
      - ../apps/web:/app/apps/web
      - ../packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules
      - /app/packages/shared/dist
    depends_on:
      - backend
    networks:
      - tracex-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:

networks:
  tracex-network:
    driver: bridge
