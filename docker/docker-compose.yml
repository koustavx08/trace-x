version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tracex-postgres
    environment:
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex
      POSTGRES_DB: tracex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracex -d tracex"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tracex-network

  neo4j:
    image: neo4j:5.15-community
    container_name: tracex-neo4j
    environment:
      NEO4J_AUTH: neo4j/tracexneo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "tracexneo4j", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - tracex-network

  redis:
    image: redis:7-alpine
    container_name: tracex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tracex-network

  backend:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tracex-backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://tracex:tracex@postgres:5432/tracex
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tracexneo4j
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: tracex-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - tracex-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:

networks:
  tracex-network:
    driver: bridge