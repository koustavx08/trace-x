version: "3.9"

services:
  # Reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: tracex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
    container_name: tracex-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    container_name: tracex-backend-prod
    environment:
      # SECRET_KEY, POSTGRES_PASSWORD, NEO4J_PASSWORD and CORS_ORIGINS have
      # no committed defaults on purpose — set real values in a local
      # untracked .env (see .env.example). No default here means
      # `docker compose config` substitutes an empty string with a
      # warning if .env is missing, rather than baking in a weak secret.
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracex}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: tracex-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tracex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No init-script mount: schema is fully owned by Alembic
      # (apps/api/alembic/versions/*) and all PKs are Python-generated
      # UUIDs (uuid.uuid4 defaults), so no pre-Alembic DB/extension
      # bootstrap is needed. See docs/KNOWN_LIMITATIONS.md.
    ports:
      - "5432:5432"
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracex} -d ${POSTGRES_DB:-tracex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  neo4j:
    image: neo4j:5.15-enterprise
    container_name: tracex-neo4j-prod
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 2g
      NEO4J_dbms_memory_heap_max__size: 8g
      NEO4J_dbms_memory_pagecache_size: 4g
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  redis:
    image: redis:7-alpine
    container_name: tracex-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tracex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tracex-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracex}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracex-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: tracex-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tracex-network
    restart: unless-stopped

  # Background worker for async tasks
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    # No container_name: deploy.replicas requires Compose to generate a
    # unique name per replica instance, which a fixed name conflicts with.
    # `python -m src.workers.main` (the previous command here) does NOT
    # start a worker -- Celery.start() parses sys.argv as CLI args, and
    # with none given it errors out ("No such command 'main.py'") and the
    # container just restart-loops forever, never processing a single task.
    command: ["celery", "-A", "src.workers.main.celery_app", "worker", "--loglevel=info"]
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracex}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  # Celery beat: schedules cleanup_stale_investigations (hourly) and
  # periodic_entity_sync (every 6h) -- see workers/main.py's beat_schedule.
  # A separate process from `worker` above; without this running, those two
  # periodic tasks are defined but never fire.
  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    container_name: tracex-beat-prod
    command: ["celery", "-A", "src.workers.main.celery_app", "beat", "--loglevel=info"]
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tracex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracex}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracex-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: tracex-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - tracex-network
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tracex-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - tracex-network
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  tracex-network:
    driver: bridge