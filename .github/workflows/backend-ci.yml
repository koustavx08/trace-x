name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-type-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tracex
          POSTGRES_PASSWORD: tracex
          POSTGRES_DB: tracex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracex -d tracex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # apps/api/pyproject.toml pins requires-python >=3.11 and
      # ruff/mypy target-version py311 — keep CI on 3.11 to match.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type-check
        run: mypy src

      - name: Create test database
        env:
          PGPASSWORD: tracex
        run: |
          psql -h localhost -U tracex -d tracex -c "CREATE DATABASE tracex_test;" || true

      - name: Run tests with coverage
        working-directory: .
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use-only-min-32-chars
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://tracex:tracex@localhost:5432/tracex
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
