name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"

# Read-only by default: nothing here writes to the repository, publishes a
# package or comments on a pull request.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant.
# Cancelling it frees the runner instead of queueing behind stale work.
# `github.ref` is the branch for pushes and the PR merge ref for pull
# requests, so pushes to main and PR updates never cancel each other.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-type-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tracex
          POSTGRES_PASSWORD: tracex
          POSTGRES_DB: tracex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracex -d tracex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # apps/api/pyproject.toml pins requires-python >=3.11 and
      # ruff/mypy target-version py311 — keep CI on 3.11 to match.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type-check
        run: mypy src

      # The demo dataset validates itself (EIP-55 checksums, one chain per
      # transaction, unique hashes, block heights that match their timestamps,
      # consistent attribution, conservation of funds). Running it as its own
      # step means a broken scenario reads as a data failure here rather than
      # as an opaque test failure further down.
      - name: Validate synthetic demo dataset
        run: python scripts/demo_dataset.py

      - name: Create test database
        env:
          PGPASSWORD: tracex
        run: |
          psql -h localhost -U tracex -d tracex -c "CREATE DATABASE tracex_test;" || true

      # --cov-fail-under is a ratchet, not a target: it sits just below the
      # measured coverage so an ordinary refactor does not trip it, while a
      # real drop (a whole module losing its tests) does. Raise it when
      # coverage rises; never lower it to make a red build green.
      - name: Run tests with coverage
        working-directory: .
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use-only-min-32-chars
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://tracex:tracex@localhost:5432/tracex
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        # Also upload when the coverage gate is what failed -- that is exactly
        # when someone wants to see which lines went uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
